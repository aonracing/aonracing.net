<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AON RACING | Modifica Sito</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2309090b'/%3E%3Ctext x='50%25' y='44%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Arial Black, sans-serif' font-style='italic' font-weight='900' font-size='22'%3EAON%3C/text%3E%3Cpolygon points='10,48 32,48 30,54 8,54' fill='%23e10600'/%3E%3Cpolygon points='32,48 56,48 54,54 30,54' fill='%2300a859'/%3E%3C/svg%3E" />
  <style>
    :root { --sveltia-accent-color: #e10600; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #09090b;
      overflow: hidden;
    }
    .aon-float-bar {
      position: fixed;
      bottom: 14px;
      right: 16px;
      z-index: 99999;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .aon-storage-pill {
      background: rgba(24, 24, 27, 0.94);
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(6px);
    }
    .aon-storage-track {
      width: 56px;
      height: 6px;
      background: #27272a;
      border-radius: 999px;
      overflow: hidden;
    }
    .aon-storage-fill {
      height: 100%;
      width: 0%;
      background: #00a859;
      transition: width 0.4s ease, background-color 0.4s ease;
    }
    .aon-float-link {
      background: #e10600;
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      opacity: 0.92;
      transition: opacity 0.2s, transform 0.2s;
    }
    .aon-float-link:hover {
      opacity: 1;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="aon-float-bar">
    <div class="aon-storage-pill" title="Spazio massimo consigliato su GitHub Pages: 1 GB (1024 MB)">
      <span id="aon-storage-text">Spazio: calcolo...</span>
      <div class="aon-storage-track">
        <div id="aon-storage-fill" class="aon-storage-fill"></div>
      </div>
    </div>
    <a href="../" target="_blank" class="aon-float-link">Apri Sito Live ↗</a>
  </div>

  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <script>
    fetch('https://api.github.com/repos/aonracing/aonracing.net')
      .then(r => r.json())
      .then(repo => {
        if (typeof repo.size !== 'number') return;
        const usedMB = (repo.size / 1024).toFixed(1);
        const maxMB = 1024;
        const pct = Math.min(100, Math.round((repo.size / (maxMB * 1024)) * 100));
        const textEl = document.getElementById('aon-storage-text');
        const fillEl = document.getElementById('aon-storage-fill');
        textEl.textContent = `Spazio: ${usedMB} MB / 1 GB (${pct}%)`;
        fillEl.style.width = `${Math.max(4, pct)}%`;
        if (pct >= 90) fillEl.style.background = '#e10600';
        else if (pct >= 75) fillEl.style.background = '#f59e0b';
      })
      .catch(() => {
        document.getElementById('aon-storage-text').textContent = 'Spazio max: 1 GB';
      });
  </script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | AON RACING</title>
  <style>
    #repo-quota-bar {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 99999;
      background: #121216;
      color: #f4f4f5;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 10px 14px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
      min-width: 245px;
      max-width: 300px;
    }
    #repo-quota-bar .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      margin-bottom: 6px;
    }
    #repo-quota-bar .track {
      width: 100%;
      height: 7px;
      background: #27272a;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    #repo-quota-bar .fill {
      height: 100%;
      width: 0%;
      background: #00a859;
      transition: width 0.4s ease, background 0.4s ease;
    }
    #repo-quota-bar .hint {
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <!-- INDICATORE SPAZIO GITHUB PAGES (MAX 1 GB) -->
  <div id="repo-quota-bar" title="Limite massimo consigliato da GitHub Pages: 1 GB">
    <div class="header">
      <span>Spazio Sito & Archivio</span>
      <span id="quota-text">Calcolo...</span>
    </div>
    <div class="track">
      <div id="quota-fill" class="fill"></div>
    </div>
    <div id="quota-hint" class="hint">
      Limite massimo: <strong>1 GB (1024 MB)</strong>. Comprimi i video prima di caricarli (max 25 MB a file).
    </div>
  </div>

  <script>
    async function checkRepoSize() {
      try {
        const res = await fetch('https://api.github.com/repos/aonracing/aonracing.net?t=' + Date.now());
        if (!res.ok) return;
        const data = await res.json();
        // data.size è espresso in KB
        const usedMB = (data.size / 1024).toFixed(1);
        const maxMB = 1024;
        const pct = Math.min(100, Math.round((data.size / 1024 / maxMB) * 100));

        const textEl = document.getElementById('quota-text');
        const fillEl = document.getElementById('quota-fill');
        const hintEl = document.getElementById('quota-hint');

        textEl.textContent = `${usedMB} MB / 1 GB (${pct}%)`;
        fillEl.style.width = pct + '%';

        if (pct >= 85) {
          fillEl.style.background = '#e10600';
          hintEl.innerHTML = '<strong>Attenzione:</strong> spazio quasi esaurito! Elimina vecchi video da <em>Archivio Extra</em> prima di caricarne altri.';
        } else if (pct >= 70) {
          fillEl.style.background = '#f59e0b';
          hintEl.innerHTML = 'Spazio oltre il 70% (max <strong>1 GB</strong>). Evita video non compressi.';
        } else {
          fillEl.style.background = '#00a859';
        }
      } catch (e) {
        document.getElementById('quota-text').textContent = 'Max 1 GB';
      }
    }

    checkRepoSize();
    // Aggiorna il contatore ogni 30 secondi (utile dopo un salvataggio)
    setInterval(checkRepoSize, 30000);
  </script>
</body>
</html>

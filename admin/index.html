<!DOCTYPE html>
<html lang="it">
<head>

  <style>
    :root { --sveltia-accent-color: #e10600; }
    body {
      margin: 0;
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    .aon-topbar {

      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .aon-back-btn {
      background: #27272a;
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      transition: background 0.2s;
    }
    .aon-back-btn:hover { background: #e10600; border-color: #e10600; }

  <div class="aon-topbar">

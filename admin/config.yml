      - name: "campionato_recensioni"
        label: "5. Campionato Predators & Recensioni"
        file: "data/site.json"
        fields:
          - { label: "Etichetta Campionato", name: "championshipBadge", widget: "string" }
          - { label: "Titolo Campionato Predators", name: "championshipTitle", widget: "string" }
          - { label: "Testo Invito Campionato", name: "championshipText", widget: "text" }

      - name: "circuiti_mappa"
        label: "4. Circuiti sulla Mappa d'Italia"
        file: "data/site.json"
        fields:
          - label: "Elenco 10 Circuiti"
            name: "circuits"
            label_singular: "Circuito"
            widget: "list"
            summary: "{{fields.name}} — {{fields.status}}"
            fields:
              - { label: "Nome Completo Circuito", name: "name", widget: "string" }
              - { label: "Nome Breve Pulsante", name: "shortName", widget: "string" }
              - { label: "Regione", name: "region", widget: "string" }
              - label: "Tracciato Telemetria"
                name: "mapPreset"
                widget: "select"
                default: "custom"
                options:
                  - { label: "Castelletto di Branduzzo", value: "castelletto" }
                  - { label: "Tazio Nuvolari", value: "nuvolari" }
                  - { label: "Varano de' Melegari", value: "varano" }
                  - { label: "Circuito di Pomposa", value: "pomposa" }
                  - { label: "Autodromo di Magione", value: "magione" }
                  - { label: "Rieti - La Mola", value: "rieti" }
                  - { label: "Val Vibrata", value: "valvibrata" }
                  - { label: "Limatola - Volturno", value: "volturno" }
                  - { label: "Circuito di Airola", value: "airola" }
                  - { label: "Binetto - Levante", value: "levante" }
                  - { label: "Tracciato Generico", value: "custom" }
              - { label: "Oppure carica Foto Mappa personalizzata (opzionale)", name: "mapImage", widget: "image", required: false }
              - { label: "Lunghezza e Curve", name: "length", widget: "string" }
              - { label: "Prossime Date / Convocazioni", name: "nextDate", widget: "string" }
              - { label: "Stato (es. Disponibile / Promo Natale 90€ / 180€)", name: "status", widget: "string" }

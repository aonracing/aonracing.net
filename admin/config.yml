backend:
  name: github
  repo: aonracing/aonracing.net
  branch: main

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "gestione_sito"
    label: "Gestione Sito AON Racing"
    files:
      - name: "contatti_testi"
        label: "1. Contatti, Social, Dati Legali e Titoli"
        file: "data/site.json"
        fields:
          - { label: "Numero WhatsApp (con 39 davanti, es. 393772548557)", name: "whatsapp", widget: "string" }
          - { label: "Email di contatto", name: "email", widget: "string" }
          - { label: "Link Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Link Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Link TikTok", name: "tiktok", widget: "string", required: false }
          - { label: "Dati Aziendali / P.IVA (mostrati nel footer e nella Privacy)", name: "companyInfo", widget: "string" }
          - { label: "Etichetta in alto (Hero)", name: "heroBadge", widget: "string" }
          - { label: "Titolo Principale - Riga 1", name: "heroTitleLine1", widget: "string" }
          - { label: "Titolo Principale - Riga Colorata", name: "heroTitleHighlight", widget: "string" }
          - { label: "Sottotitolo Principale", name: "heroSubtitle", widget: "text" }
          - { label: "Titolo Sezione Chi Siamo", name: "aboutTitle", widget: "string" }
          - { label: "Descrizione Team (Paragrafo 1)", name: "aboutText1", widget: "text" }
          - { label: "Descrizione Team (Paragrafo 2)", name: "aboutText2", widget: "text" }
          - label: "Scheda Tecnica Monoposto"
            name: "carSpecs"
            label_singular: "Voce Tecnica"
            widget: "list"
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { label: "Parametro", name: "label", widget: "string" }
              - { label: "Valore", name: "value", widget: "string" }
          - { label: "steps", name: "steps", widget: "hidden" }
          - { label: "circuits", name: "circuits", widget: "hidden" }
          - { label: "packages", name: "packages", widget: "hidden" }
          - { label: "reviews", name: "reviews", widget: "hidden" }
          - { label: "sponsorTitle", name: "sponsorTitle", widget: "hidden" }
          - { label: "sponsorText", name: "sponsorText", widget: "hidden" }
          - { label: "mediaKitUrl", name: "mediaKitUrl", widget: "hidden" }
          - { label: "gallery", name: "gallery", widget: "hidden" }
          - { label: "faqs", name: "faqs", widget: "hidden" }
          - { label: "heroVideo", name: "heroVideo", widget: "hidden" }
          - { label: "heroPoster", name: "heroPoster", widget: "hidden" }
          - { label: "teamImage", name: "teamImage", widget: "hidden" }

      - name: "pacchetti_prezzi"
        label: "2. Pacchetti Regalo e Prezzi"
        file: "data/site.json"
        fields:
          - label: "Elenco Pacchetti"
            name: "packages"
            label_singular: "Pacchetto"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { label: "Codice interno (es. bronze, silver, gold)", name: "id", widget: "string" }
              - { label: "Etichetta in alto (es. PIÙ REGALATO)", name: "badge", widget: "string" }
              - { label: "Titolo Pacchetto", name: "name", widget: "string" }
              - { label: "Giri / Durata", name: "laps", widget: "string" }
              - { label: "Prezzo (es. 199€)", name: "price", widget: "string" }
              - { label: "Metti in evidenza con bordo rosso?", name: "featured", widget: "boolean", default: false }
              - label: "Cosa include (punti elenco)"
                name: "features"
                label_singular: "Voce"
                widget: "list"
                field: { label: "Descrizione", name: "item", widget: "string" }
          - { label: "whatsapp", name: "whatsapp", widget: "hidden" }
          - { label: "email", name: "email", widget: "hidden" }
          - { label: "instagram", name: "instagram", widget: "hidden" }
          - { label: "facebook", name: "facebook", widget: "hidden" }
          - { label: "tiktok", name: "tiktok", widget: "hidden" }
          - { label: "companyInfo", name: "companyInfo", widget: "hidden" }
          - { label: "heroBadge", name: "heroBadge", widget: "hidden" }
          - { label: "heroTitleLine1", name: "heroTitleLine1", widget: "hidden" }
          - { label: "heroTitleHighlight", name: "heroTitleHighlight", widget: "hidden" }
          - { label: "heroSubtitle", name: "heroSubtitle", widget: "hidden" }
          - { label: "aboutTitle", name: "aboutTitle", widget: "hidden" }
          - { label: "aboutText1", name: "aboutText1", widget: "hidden" }
          - { label: "aboutText2", name: "aboutText2", widget: "hidden" }
          - { label: "carSpecs", name: "carSpecs", widget: "hidden" }
          - { label: "steps", name: "steps", widget: "hidden" }
          - { label: "circuits", name: "circuits", widget: "hidden" }
          - { label: "reviews", name: "reviews", widget: "hidden" }
          - { label: "sponsorTitle", name: "sponsorTitle", widget: "hidden" }
          - { label: "sponsorText", name: "sponsorText", widget: "hidden" }
          - { label: "mediaKitUrl", name: "mediaKitUrl", widget: "hidden" }
          - { label: "gallery", name: "gallery", widget: "hidden" }
          - { label: "faqs", name: "faqs", widget: "hidden" }
          - { label: "heroVideo", name: "heroVideo", widget: "hidden" }
          - { label: "heroPoster", name: "heroPoster", widget: "hidden" }
          - { label: "teamImage", name: "teamImage", widget: "hidden" }

      - name: "circuiti_date"
        label: "3. Circuiti e Prossime Date"
        file: "data/site.json"
        fields:
          - label: "Elenco Circuiti / Tappe"
            name: "circuits"
            label_singular: "Circuito"
            widget: "list"
            summary: "{{fields.name}} — {{fields.nextDate}}"
            fields:
              - { label: "Nome Circuito e Città", name: "name", widget: "string" }
              - label: "Tracciato Animato Predefinito"
                name: "mapPreset"
                widget: "select"
                default: "custom"
                options:
                  - { label: "Castelletto di Branduzzo", value: "castelletto" }
                  - { label: "Tazio Nuvolari (Cervesina)", value: "nuvolari" }
                  - { label: "Varano de' Melegari", value: "varano" }
                  - { label: "Circuito di Pomposa", value: "pomposa" }
                  - { label: "Autodromo di Magione", value: "magione" }
                  - { label: "Rieti - La Mola", value: "rieti" }
                  - { label: "Val Vibrata", value: "valvibrata" }
                  - { label: "Circuito del Volturno", value: "volturno" }
                  - { label: "Circuito di Airola", value: "airola" }
                  - { label: "Autodromo del Levante", value: "levante" }
                  - { label: "Tracciato Generico Animato", value: "custom" }
              - { label: "Oppure carica Foto Mappa personalizzata (opzionale)", name: "mapImage", widget: "image", required: false }
              - { label: "Lunghezza e Curve", name: "length", widget: "string" }
              - { label: "Prossime Date", name: "nextDate", widget: "string" }
              - { label: "Stato (es. Disponibile / Posti Limitati)", name: "status", widget: "string" }
          - { label: "whatsapp", name: "whatsapp", widget: "hidden" }
          - { label: "email", name: "email", widget: "hidden" }
          - { label: "instagram", name: "instagram", widget: "hidden" }
          - { label: "facebook", name: "facebook", widget: "hidden" }
          - { label: "tiktok", name: "tiktok", widget: "hidden" }
          - { label: "companyInfo", name: "companyInfo", widget: "hidden" }
          - { label: "heroBadge", name: "heroBadge", widget: "hidden" }
          - { label: "heroTitleLine1", name: "heroTitleLine1", widget: "hidden" }
          - { label: "heroTitleHighlight", name: "heroTitleHighlight", widget: "hidden" }
          - { label: "heroSubtitle", name: "heroSubtitle", widget: "hidden" }
          - { label: "aboutTitle", name: "aboutTitle", widget: "hidden" }
          - { label: "aboutText1", name: "aboutText1", widget: "hidden" }
          - { label: "aboutText2", name: "aboutText2", widget: "hidden" }
          - { label: "carSpecs", name: "carSpecs", widget: "hidden" }
          - { label: "steps", name: "steps", widget: "hidden" }
          - { label: "packages", name: "packages", widget: "hidden" }
          - { label: "reviews", name: "reviews", widget: "hidden" }
          - { label: "sponsorTitle", name: "sponsorTitle", widget: "hidden" }
          - { label: "sponsorText", name: "sponsorText", widget: "hidden" }
          - { label: "mediaKitUrl", name: "mediaKitUrl", widget: "hidden" }
          - { label: "gallery", name: "gallery", widget: "hidden" }
          - { label: "faqs", name: "faqs", widget: "hidden" }
          - { label: "heroVideo", name: "heroVideo", widget: "hidden" }
          - { label: "heroPoster", name: "heroPoster", widget: "hidden" }
          - { label: "teamImage", name: "teamImage", widget: "hidden" }

      - name: "galleria_foto"
        label: "4. Galleria Foto in Pista"
        file: "data/site.json"
        fields:
          - label: "Foto nella Galleria"
            name: "gallery"
            label_singular: "Foto"
            widget: "list"
            summary: "{{fields.caption}} ({{fields.image}})"
            fields:
              - label: "Seleziona o carica foto"
                name: "image"
                widget: "image"
                choose_url: true
              - { label: "Descrizione foto", name: "caption", widget: "string" }
          - { label: "whatsapp", name: "whatsapp", widget: "hidden" }
          - { label: "email", name: "email", widget: "hidden" }
          - { label: "instagram", name: "instagram", widget: "hidden" }
          - { label: "facebook", name: "facebook", widget: "hidden" }
          - { label: "tiktok", name: "tiktok", widget: "hidden" }
          - { label: "companyInfo", name: "companyInfo", widget: "hidden" }

backend:
  name: github
  repo: aonracing/aonracing.net
  branch: main

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "gestione_sito"
    label: "Gestione Sito AON Racing"
    files:
      - name: "prezzi_promo"
        label: "1. Prezzi Promo (90€ / 180€) e Listino Turni"
        file: "data/site.json"
        editor:
          preview: false
        fields:
          - label: "Offerte Promo in Alto (3 Giri 90€ / 6 Giri 180€)"
            name: "packages"
            label_singular: "Offerta Promo"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { label: "Codice ID", name: "id", widget: "string" }
              - { label: "Scritta piccola sopra", name: "badge", widget: "string" }
              - { label: "Titolo Offerta", name: "name", widget: "string" }
              - { label: "Piste valide", name: "laps", widget: "string" }
              - { label: "Prezzo (es. 90€)", name: "price", widget: "string" }
              - { label: "Evidenzia con bordo rosso?", name: "featured", widget: "boolean", default: false }
              - label: "Cosa è incluso (elenco)"
                name: "features"
                label_singular: "Riga"
                widget: "list"
                field: { label: "Testo", name: "item", widget: "string" }
          - label: "Listino Turni Completi per ogni Pista"
            name: "turnPriceList"
            label_singular: "Pista"
            widget: "list"
            summary: "[{{fields.area}}] {{fields.circuit}} ({{fields.duration}})"
            fields:
              - { label: "Codice ID Pista", name: "id", widget: "string" }
              - label: "Zona"
                name: "area"
                widget: "select"
                options: ["NORD", "CENTRO", "SUD"]
              - { label: "Nome Pista", name: "circuit", widget: "string" }
              - { label: "Durata Turno", name: "duration", widget: "string" }
              - label: "Prezzi per numero di turni"
                name: "tiers"
                label_singular: "Prezzo Turno"
                widget: "list"
                summary: "{{fields.turns}} -> {{fields.price}}"
                fields:
                  - { label: "Quanti turni", name: "turns", widget: "string" }
                  - { label: "Prezzo", name: "price", widget: "string" }
          - { label: "whatsapp", name: "whatsapp", widget: "hidden" }
          - { label: "email", name: "email", widget: "hidden" }
          - { label: "instagram", name: "instagram", widget: "hidden" }
          - { label: "facebook", name: "facebook", widget: "hidden" }
          - { label: "tiktok", name: "tiktok", widget: "hidden" }
          - { label: "companyInfo", name: "companyInfo", widget: "hidden" }
          - { label: "heroBadge", name: "heroBadge", widget: "hidden" }
          - { label: "heroTitleLine1", name: "heroTitleLine1", widget: "hidden" }
          - { label: "heroTitleHighlight", name: "heroTitleHighlight", widget: "hidden" }
          - { label: "heroSubtitle", name: "heroSubtitle", widget: "hidden" }
          - { label: "aboutTitle", name: "aboutTitle", widget: "hidden" }
          - { label: "aboutText1", name: "aboutText1", widget: "hidden" }
          - { label: "aboutText2", name: "aboutText2", widget: "hidden" }
          - { label: "carSpecs", name: "carSpecs", widget: "hidden" }
          - { label: "steps", name: "steps", widget: "hidden" }
          - { label: "circuits", name: "circuits", widget: "hidden" }
          - { label: "reviews", name: "reviews", widget: "hidden" }
          - { label: "championshipBadge", name: "championshipBadge", widget: "hidden" }
          - { label: "championshipTitle", name: "championshipTitle", widget: "hidden" }
          - { label: "championshipText", name: "championshipText", widget: "hidden" }
          - { label: "championshipImage", name: "championshipImage", widget: "hidden" }
          - { label: "gallery", name: "gallery", widget: "hidden" }
          - { label: "faqs", name: "faqs", widget: "hidden" }
          - { label: "heroVideo", name: "heroVideo", widget: "hidden" }
          - { label: "heroPoster", name: "heroPoster", widget: "hidden" }
          - { label: "teamImage", name: "teamImage", widget: "hidden" }

      - name: "contatti_testi"
        label: "2. WhatsApp, Email, Social, Testi e Scheda PC015H"
        file: "data/site.json"
        editor:
          preview: false
        fields:
          - { label: "Numero WhatsApp (con 39 davanti)", name: "whatsapp", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Link Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Link Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Link TikTok", name: "tiktok", widget: "string", required: false }
          - { label: "Partita IVA e Dati Azienda", name: "companyInfo", widget: "string" }
          - { label: "Scritta piccola in cima", name: "heroBadge", widget: "string" }
          - { label: "Titolo Grande (Riga Bianca)", name: "heroTitleLine1", widget: "string" }
          - { label: "Titolo Grande (Riga Colorata)", name: "heroTitleHighlight", widget: "string" }
          - { label: "Testo sotto il titolo principale", name: "heroSubtitle", widget: "text" }
          - { label: "Titolo Chi Siamo", name: "aboutTitle", widget: "string" }
          - { label: "Testo Chi Siamo (Parte 1)", name: "aboutText1", widget: "text" }
          - { label: "Testo Chi Siamo (Parte 2)", name: "aboutText2", widget: "text" }
          - label: "Scheda Tecnica Monoposto (PC015H)"
            name: "carSpecs"
            label_singular: "Voce Tecnica"
            widget: "list"
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { label: "Parametro", name: "label", widget: "string" }
              - { label: "Valore", name: "value", widget: "string" }
          - label: "I 4 Passaggi (Come Funziona)"
            name: "steps"
            label_singular: "Passaggio"
            widget: "list"
            summary: "{{fields.num}} — {{fields.title}}"
            fields:
              - { label: "Numero", name: "num", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Descrizione", name: "desc", widget: "text" }
          - { label: "circuits", name: "circuits", widget: "hidden" }
          - { label: "packages", name: "packages", widget: "hidden" }
          - { label: "turnPriceList", name: "turnPriceList", widget: "hidden" }
          - { label: "reviews", name: "reviews", widget: "hidden" }
          - { label: "championshipBadge", name: "championshipBadge", widget: "hidden" }
          - { label: "championshipTitle", name: "championshipTitle", widget: "hidden" }
          - { label: "championshipText", name: "championshipText", widget: "hidden" }
          - { label: "championshipImage", name: "championshipImage", widget: "hidden" }
          - { label: "gallery", name: "gallery", widget: "hidden" }
          - { label: "faqs", name: "faqs", widget: "hidden" }
          - { label: "heroVideo", name: "heroVideo", widget: "hidden" }
          - { label: "heroPoster", name: "heroPoster", widget: "hidden" }
          - { label: "teamImage", name: "teamImage", widget: "hidden" }

      - name: "campionato_recensioni_faq"
        label: "3. Campionato Predators, Recensioni e FAQ"
        file: "data/site.json"
        editor:
          preview: false
        fields:
          - { label: "Etichetta Campionato", name: "championshipBadge", widget: "string" }
          - { label: "Titolo Sezione Campionato", name: "championshipTitle", widget: "string" }
          - { label: "Testo Campionato Predators", name: "championshipText", widget: "text" }
          - { label: "Foto Sezione Campionato", name: "championshipImage", widget: "image", choose_url: true }
          - label: "Recensioni Piloti"
            name: "reviews"
            label_singular: "Recensione"
            widget: "list"
            summary: "{{fields.author}}"
            fields:
              - { label: "Nome Pilota", name: "author", widget: "string" }
              - { label: "Etichetta", name: "package", widget: "string" }
              - { label: "Commento", name: "text", widget: "text" }
          - label: "Domande Frequenti (FAQ)"
            name: "faqs"
            label_singular: "Domanda"
            widget: "list"
            summary: "{{fields.q}}"
            fields:
              - { label: "Domanda", name: "q", widget: "string" }
              - { label: "Risposta", name: "a", widget: "text" }
          - { label: "whatsapp", name: "whatsapp", widget: "hidden" }
          - { label: "email", name: "email", widget: "hidden" }
          - { label: "instagram", name: "instagram", widget: "hidden" }
          - { label: "facebook", name: "facebook", widget: "hidden" }
          - { label: "tiktok", name: "tiktok", widget: "hidden" }
          - { label: "companyInfo", name: "companyInfo", widget: "hidden" }
          - { label: "heroBadge", name: "heroBadge", widget: "hidden" }
          - { label: "heroTitleLine1", name: "heroTitleLine1", widget: "hidden" }
          - { label: "heroTitleHighlight", name: "heroTitleHighlight", widget: "hidden" }
          - { label: "heroSubtitle", name: "heroSubtitle", widget: "hidden" }
          - { label: "aboutTitle", name: "aboutTitle", widget: "hidden" }
          - { label: "aboutText1", name: "aboutText1", widget: "hidden" }
          - { label: "aboutText2", name: "aboutText2", widget: "hidden" }
          - { label: "carSpecs", name: "carSpecs", widget: "hidden" }
          - { label: "steps", name: "steps", widget: "hidden" }
          - { label: "circuits", name: "circuits", widget: "hidden" }
          - { label: "packages", name: "packages", widget: "hidden" }
          - { label: "turnPriceList", name: "turnPriceList", widget: "hidden" }
          - { label: "gallery", name: "gallery", widget: "hidden" }
          - { label: "heroVideo", name: "heroVideo", widget: "hidden" }
          - { label: "heroPoster", name: "heroPoster", widget: "hidden" }
          - { label: "teamImage", name: "teamImage", widget: "hidden" }

      - name: "foto_video_piste"
        label: "4. Foto, Video Sfondo e Date Circuiti"
        file: "data/site.json"
        editor:
          preview: false
        fields:
          - { label: "Video Sfondo Principale (.mp4)", name: "heroVideo", widget: "file", choose_url: true }
          - { label: "Foto Copertina Video", name: "heroPoster", widget: "image", choose_url: true }
          - { label: "Foto del Team", name: "teamImage", widget: "image", choose_url: true }
          - label: "Galleria Foto in Pista"
            name: "gallery"
            label_singular: "Foto"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Scegli o carica foto", name: "image", widget: "image", choose_url: true }
              - { label: "Descrizione foto", name: "caption", widget: "string" }
          - label: "I 10 Circuiti sulla Mappa"
            name: "circuits"
            label_singular: "Circuito"
            widget: "list"
            summary: "{{fields.name}} — {{fields.status}}"
            fields:
              - { label: "Nome Circuito", name: "name", widget: "string" }
              - { label: "Nome Breve Pulsante", name: "shortName", widget: "string" }
              - { label: "Regione", name: "region", widget: "string" }
              - { label: "Codice Tracciato", name: "mapPreset", widget: "string" }
              - { label: "Lunghezza e Curve", name: "length", widget: "string" }
              - { label: "Prossime Date", name: "nextDate", widget: "string" }
              - { label: "Stato", name: "status", widget: "string" }
          - { label: "whatsapp", name: "whatsapp", widget: "hidden" }
          - { label: "email", name: "email", widget: "hidden" }
          - { label: "instagram", name: "instagram", widget: "hidden" }
          - { label: "facebook", name: "facebook", widget: "hidden" }
          - { label: "tiktok", name: "tiktok", widget: "hidden" }
          - { label: "companyInfo", name: "companyInfo", widget: "hidden" }
          - { label: "heroBadge", name: "heroBadge", widget: "hidden" }
          - { label: "heroTitleLine1", name: "heroTitleLine1", widget: "hidden" }
          - { label: "heroTitleHighlight", name: "heroTitleHighlight", widget: "hidden" }
          - { label: "heroSubtitle", name: "heroSubtitle", widget: "hidden" }
          - { label: "aboutTitle", name: "aboutTitle", widget: "hidden" }
          - { label: "aboutText1", name: "aboutText1", widget: "hidden" }
          - { label: "aboutText2", name: "aboutText2", widget: "hidden" }
          - { label: "carSpecs", name: "carSpecs", widget: "hidden" }
          - { label: "steps", name: "steps", widget: "hidden" }
          - { label: "packages", name: "packages", widget: "hidden" }
          - { label: "turnPriceList", name: "turnPriceList", widget: "hidden" }
          - { label: "reviews", name: "reviews", widget: "hidden" }
          - { label: "championshipBadge", name: "championshipBadge", widget: "hidden" }
          - { label: "championshipTitle", name: "championshipTitle", widget: "hidden" }
          - { label: "championshipText", name: "championshipText", widget: "hidden" }
          - { label: "championshipImage", name: "championshipImage", widget: "hidden" }
          - { label: "faqs", name: "faqs", widget: "hidden" }

  - name: "archivio_extra"
    label: "Archivio Extra (Foto & Logo)"
    folder: "archivio_extra"
    media_folder: "archivio_extra"
    public_folder: "archivio_extra"
    create: false
    delete: false
    fields:
      - { label: "Nome File", name: "title", widget: "string" }
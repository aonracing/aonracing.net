          - { label: "reviews", name: "reviews", widget: "hidden" }
          - { label: "sponsorTitle", name: "sponsorTitle", widget: "hidden" }
          - { label: "sponsorText", name: "sponsorText", widget: "hidden" }
          - { label: "mediaKitUrl", name: "mediaKitUrl", widget: "hidden" }
          - { label: "faqs", name: "faqs", widget: "hidden" }
          - { label: "heroVideo", name: "heroVideo", widget: "hidden" }
          - { label: "heroPoster", name: "heroPoster", widget: "hidden" }
          - { label: "teamImage", name: "teamImage", widget: "hidden" }

      - name: "recensioni_sponsor"
        label: "5. Recensioni Piloti & Area Sponsor"
        file: "data/site.json"
        fields:
          - label: "Recensioni dei Piloti"
            name: "reviews"
            label_singular: "Recensione"
            widget: "list"
            summary: "{{fields.author}} ({{fields.package}})"
            fields:
              - { label: "Nome Pilota (es. Marco R.)", name: "author", widget: "string" }
              - { label: "Pacchetto provato", name: "package", widget: "string" }
              - { label: "Testo recensione", name: "text", widget: "text" }
          - { label: "Titolo Sezione Sponsor & Aziende", name: "sponsorTitle", widget: "string" }
          - { label: "Descrizione Proposta Sponsor / Eventi", name: "sponsorText", widget: "text" }
          - { label: "File PDF Media Kit Sponsor (opzionale)", name: "mediaKitUrl", widget: "file", required: false }
          - { label: "whatsapp", name: "whatsapp", widget: "hidden" }
          - { label: "email", name: "email", widget: "hidden" }
          - { label: "instagram", name: "instagram", widget: "hidden" }
          - { label: "facebook", name: "facebook", widget: "hidden" }

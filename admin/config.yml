      - name: "video_sfondi"
        label: "7. Video Sfondo e Foto Team"
        file: "data/site.json"
        fields:
          - { label: "Video Sfondo Principale (.mp4)", name: "heroVideo", widget: "file", choose_url: true }
          - { label: "Foto Anteprima Video", name: "heroPoster", widget: "image", choose_url: true }

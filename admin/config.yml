backend:
  name: github
  repo: aonracing/aonracing.net
  branch: main

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "gestione_sito"
    label: "Gestione Sito AON Racing"
    files:
      - name: "contatti_testi"
        label: "1. Contatti, Social, Testi Principali & Vettura"
        file: "data/site.json"
        fields:
          - { label: "Numero WhatsApp (con 39 davanti, es. 393772548557)", name: "whatsapp", widget: "string" }
          - { label: "Email di contatto", name: "email", widget: "string" }
          - { label: "Link Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Link Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Link TikTok", name: "tiktok", widget: "string", required: false }
          - { label: "Dati Aziendali / P.IVA (nel footer e Privacy)", name: "companyInfo", widget: "string" }
          - { label: "Etichetta in alto (Hero)", name: "heroBadge", widget: "string" }
          - { label: "Titolo Principale - Riga 1", name: "heroTitleLine1", widget: "string" }
          - { label: "Titolo Principale - Riga Colorata", name: "heroTitleHighlight", widget: "string" }
          - { label: "Sottotitolo Principale", name: "heroSubtitle", widget: "text" }
          - { label: "Titolo Sezione Chi Siamo", name: "aboutTitle", widget: "string" }
          - { label: "Descrizione Team (Paragrafo 1)", name: "aboutText1", widget: "text" }
          - { label: "Descrizione Team (Paragrafo 2)", name: "aboutText2", widget: "text" }
          - label: "Scheda Tecnica Monoposto (PC015H)"
            name: "carSpecs"
            label_singular: "Voce Tecnica"
            widget: "list"
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { label: "Parametro", name: "label", widget: "string" }
              - { label: "Valore", name: "value", widget: "string" }
          - { label: "steps", name: "steps", widget: "hidden" }
          - { label: "circuits", name: "circuits", widget: "hidden" }
          - { label: "packages", name: "packages", widget: "hidden" }
          - { label: "turnPriceList", name: "turnPriceList", widget: "hidden" }
          - { label: "reviews", name: "reviews", widget: "hidden" }
          - { label: "championshipBadge", name: "championshipBadge", widget: "hidden" }
          - { label: "championshipTitle", name: "championshipTitle", widget: "hidden" }
          - { label: "championshipText", name: "championshipText", widget: "hidden" }
          - { label: "championshipImage", name: "championshipImage", widget: "hidden" }
          - { label: "gallery", name: "gallery", widget: "hidden" }
          - { label: "faqs", name: "faqs", widget: "hidden" }
          - { label: "heroVideo", name: "heroVideo", widget: "hidden" }
          - { label: "heroPoster", name: "heroPoster", widget: "hidden" }
          - { label: "teamImage", name: "teamImage", widget: "hidden" }

      - name: "pacchetti_promo"
        label: "2. Pacchetti Promo (90€ / 180€)"
        file: "data/site.json"
        fields:
          - label: "Card Pacchetti in Evidenza"
            name: "packages"
            label_singular: "Pacchetto"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { label: "Codice interno (es. promo-3-giri)", name: "id", widget: "string" }
              - { label: "Etichetta in alto", name: "badge", widget: "string" }
              - { label: "Titolo Pacchetto", name: "name", widget: "string" }
              - { label: "Piste valide / Sottotitolo", name: "laps", widget: "string" }
              - { label: "Prezzo (es. 90€)", name: "price", widget: "string" }
              - { label: "Metti in evidenza con bordo rosso?", name: "featured", widget: "boolean", default: false }
              - label: "Cosa include (punti elenco)"
                name: "features"
                label_singular: "Voce"
                widget: "list"
                field: { label: "Descrizione", name: "item", widget: "string" }
          - { label: "whatsapp", name: "whatsapp", widget: "hidden" }
          - { label: "email", name: "email", widget: "hidden" }
          - { label: "instagram", name: "instagram", widget: "hidden" }
          - { label: "facebook", name: "facebook", widget: "hidden" }
          - { label: "tiktok", name: "tiktok", widget: "hidden" }
          - { label: "companyInfo", name: "companyInfo", widget: "hidden" }

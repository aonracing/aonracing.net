          - { label: "circuits", name: "circuits", widget: "hidden" }
          - { label: "packages", name: "packages", widget: "hidden" }
          - { label: "gallery", name: "gallery", widget: "hidden" }
          - { label: "faqs", name: "faqs", widget: "hidden" }
          - { label: "heroVideo", name: "heroVideo", widget: "hidden" }
          - { label: "heroPoster", name: "heroPoster", widget: "hidden" }
          - { label: "teamImage", name: "teamImage", widget: "hidden" }

      - name: "faq_step"
        label: "6. Come Funziona & FAQ"
        file: "data/site.json"
        fields:
          - label: "I 4 Passaggi (Come Funziona)"
            name: "steps"
            label_singular: "Passaggio"
            widget: "list"
            summary: "{{fields.num}} — {{fields.title}}"
            fields:
              - { label: "Numero (es. 01)", name: "num", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Descrizione", name: "desc", widget: "text" }
          - label: "Domande Frequenti (FAQ)"
            name: "faqs"
            label_singular: "Domanda"
            widget: "list"
            summary: "{{fields.q}}"
            fields:
              - { label: "Domanda", name: "q", widget: "string" }
              - { label: "Risposta", name: "a", widget: "text" }
          - { label: "whatsapp", name: "whatsapp", widget: "hidden" }
          - { label: "email", name: "email", widget: "hidden" }
